<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="card">
    <h1>Placement Prediction</h1>
    <form method="POST">
      <label for="iq">IQ</label>
      <input id="iq" name="iq" type="number" step="1" required placeholder="Enter IQ" />

      <label for="cgpa">CGPA</label>
      <input id="cgpa" name="cgpa" type="number" step="0.1" required placeholder="Enter CGPA" />

      <button type="submit">Predict</button>
    </form>

    {% if result %}
      <div class="result">Prediction: {{ result }}</div>
    {% endif %}
  </div>
</body>
</html>
